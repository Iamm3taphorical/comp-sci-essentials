name: Daily Resource Upload

on:
  schedule:
    # Random times between 7 PM - 11 PM Bangladesh time (UTC+6)
    # 7 PM BD = 1 PM UTC, 11 PM BD = 5 PM UTC
    - cron: '0 13 * * *'   # 7:00 PM BD
    - cron: '30 14 * * *'  # 8:30 PM BD
    - cron: '15 15 * * *'  # 9:15 PM BD
    - cron: '45 16 * * *'  # 10:45 PM BD
  workflow_dispatch:  # Manual trigger

jobs:
  upload-resources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Calculate current day
        id: day
        run: |
          START_DATE="2026-01-07"
          TODAY=$(date -u +%Y-%m-%d)
          DAYS=$(( ($(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s)) / 86400 + 1 ))
          echo "day_num=$DAYS" >> $GITHUB_OUTPUT
          echo "Day number: $DAYS"

      - name: Check if within 30-day window
        id: check
        run: |
          if [ ${{ steps.day.outputs.day_num }} -le 30 ] && [ ${{ steps.day.outputs.day_num }} -ge 1 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Get scheduled files for today
        if: steps.check.outputs.should_run == 'true'
        run: |
          DAY=$(printf '%02d' ${{ steps.day.outputs.day_num }})
          if [ -d "scheduled-uploads/day-$DAY" ]; then
            # Move files from scheduled folder to main structure
            cp -r scheduled-uploads/day-$DAY/* . 2>/dev/null || true
            # Remove the scheduled folder for this day to clean up
            rm -rf "scheduled-uploads/day-$DAY"
            echo "Moved files for day $DAY"
          fi

      - name: Random delay (appear natural)
        if: steps.check.outputs.should_run == 'true'
        run: |
          DELAY=$((RANDOM % 1800))  # Random delay 0-30 minutes
          echo "Waiting $DELAY seconds..."
          sleep $DELAY

      - name: Commit and push
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "Mahir Dyan"
          git config user.email "mahir@users.noreply.github.com"
          git add .
          
          # Random commit messages
          MESSAGES=(
            "📚 Added new learning resources"
            "✨ Updated study materials"
            "📖 New notes and guides"
            "🚀 Added more interview prep content"
            "📝 Updated documentation"
            "💡 Added helpful resources"
            "🎯 New problem sets added"
            "📊 Updated CS fundamentals"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          
          git commit -m "$MSG" || echo "No changes to commit"
          git push || echo "Nothing to push"
