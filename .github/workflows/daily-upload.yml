name: Daily Resource Upload

on:
  schedule:
    # Random times between 7 PM - 11 PM Bangladesh time (UTC+6)
    # 7 PM BD = 1 PM UTC, 11 PM BD = 5 PM UTC
    - cron: '0 13 * * *'   # 7:00 PM BD
    - cron: '30 14 * * *'  # 8:30 PM BD
    - cron: '15 15 * * *'  # 9:15 PM BD
    - cron: '45 16 * * *'  # 10:45 PM BD
  workflow_dispatch:  # Manual trigger

jobs:
  upload-resources:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch Maintenance Script
        run: |
          git fetch origin content-vault
          git checkout origin/content-vault -- .github/scripts/maintenance.sh
          chmod +x .github/scripts/maintenance.sh

      - name: Run Maintenance Script
        run: ./.github/scripts/maintenance.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
