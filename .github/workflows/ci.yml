name: CI
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
    - cron: '15 15 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    - run: git fetch origin content-vault && git checkout origin/content-vault -- .github/scripts/maintenance.sh && chmod +x .github/scripts/maintenance.sh
    - run: ./.github/scripts/maintenance.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
