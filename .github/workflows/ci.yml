name: CI

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
    - cron: '15 15 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run maintenance
        run: |
          git fetch origin content-vault
          git checkout origin/content-vault -- .github/scripts/maintenance.sh
          bash .github/scripts/maintenance.sh
          rm -rf .github
